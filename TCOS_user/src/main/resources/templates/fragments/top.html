<script>
	function remove_data() {
		Swal.fire({
			title: 'Are you sure you want to apply for account closure in Society?',
			text: 'Confirm first',
			icon: 'warning',
			showCancelButton: true,
			confirmButtonColor: '#3085d6',
			cancelButtonColor: '#d33',
			confirmButtonText: 'Yes, Apply for closure.'
		}).then((result) => {
			if (result.isConfirmed) {
				// Delete event
				$.ajax({
					url: 'accountClosure',
					type: 'GET',
					dataType: 'json',
					contentType: 'application/json',
					success: function (data) {
						if (data.status == "1") {
							Swal.fire({
								title: data.msg,
								icon: 'success',
							}).then((result) => {
								dtable.draw();
							});
						} else {
							Swal.fire(data.msg, '', 'error');
						}
					},
					error: function (xhr, textStatus, errorThrown) {
						Swal.fire('Error', 'An error occurred while applying for closure.', 'error');
					}
				});

			} else {
				Swal.close();
			}
		});
	}
</script>
