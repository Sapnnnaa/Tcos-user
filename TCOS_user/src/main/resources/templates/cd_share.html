<style>
    
    /* Modern badge styles */
    .badge {
        display: inline-block;
        padding: 6px 12px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 20px;
        letter-spacing: 0.5px;
    }

    .badge-other {
        color: white;
        background: linear-gradient(135deg, #ff5e62, #ff2400);
        box-shadow: 0 2px 5px rgba(255, 94, 98, 0.3);
    }

    .badge-active {
        color: white;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        box-shadow: 0 2px 5px rgba(79, 172, 254, 0.3);
    }

    /* Dashboard card styling */
    .dashboard-card {
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        background: white;
        overflow: hidden;
    }

    .dashboard-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    /* Statistic boxes */
    .stat-box {
        padding: 25px 20px;
        border-radius: 10px;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
    }

    .stat-box .stat-label {
        font-size: 14px;
        color: #6b7280;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .stat-box .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
    }

    /* Form styling */
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .form-card .form-title {
        font-size: 18px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
    }

    .form-card .form-title i {
        margin-right: 10px;
        color: #3b82f6;
    }

    /* Alert styling */
    .alert {
        border-radius: 8px;
        padding: 12px 15px;
        margin-top: 15px;
        font-size: 14px;
    }

    .alert-success {
        background-color: #d1fae5;
        color: #065f46;
        border-left: 4px solid #10b981;
    }

    .alert-danger {
        background-color: #fee2e2;
        color: #b91c1c;
        border-left: 4px solid #ef4444;
    }

    /* Button styling */
    .btn-warning {
        background: linear-gradient(135deg, #f59e0b, #f97316);
        color: white;
        border: none;
        font-weight: 600;
        border-radius: 8px;
        padding: 10px 20px;
        transition: all 0.3s ease;
    }

    .btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
    }

    /* Input styling */
    .form-control {
        border-radius: 8px;
        padding: 10px 15px;
        border: 1px solid #e5e7eb;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Section header */
    .section-header {
        font-size: 24px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
    }

    .section-header i {
        margin-right: 12px;
        color: #3b82f6;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .stat-box {
            padding: 20px 15px;
        }

        .stat-box .stat-value {
            font-size: 24px;
        }
    }
</style>
