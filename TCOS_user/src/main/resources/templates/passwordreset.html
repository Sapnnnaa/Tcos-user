<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.thymeleaf.org">
<!-- BEGIN: Head -->

<head>
    <meta charset="utf-8">
    <link href="../dist/images/logo.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TELCO - Demo</title>
    <!-- BEGIN: CSS Assets-->
    <link rel="stylesheet" href="../dist/css/app.css" />
    <link rel="stylesheet" href="../dist/css/jquery.dataTables.min.css" />
    <!-- END: CSS Assets-->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>
<style>
    .dataTables_length select {
        width: 60px;
    }

    /* Hard-coded styles for badges */
    .badge {
        display: inline-block;
        padding: 5px 10px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 5px;
    }

    /* Custom badge styles for "Transferred, InActive and Resigned" status */
    .badge-other {
        color: white;
        background-color: red;
    }

    /* Custom badge styles for "Active" statuses */
    .badge-active {
        color: white;
        background-color: green;
    }
</style>
<!-- END: Head -->

<body class="py-5 md:py-0">
    <div class="flex md:mt-0">

        <div th:replace="~{/fragments/nav}"></div>
        <div th:insert="~{/fragments/mob}"></div>
        <!-- BEGIN: Content -->
        <div class="content content--top-nav">

            <div th:replace="~{/fragments/top}"></div>
            <div class="intro-y flex items-center mt-8">
                <h2 class="text-lg font-medium mr-auto">
                    Change password
                </h2>

            </div>


            <div class="box grid grid-cols-12">
                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <form th:action="@{/user/resetpassword}" method="post">
                        <div class="mb-4">
                            <label class="block font-medium">Old Password: </label>
                            <input type="password" id="oldpassword" name="oldPassword"
                                class="form-control w-full box pr-10" required>
                        </div>

                        <div class="mb-4">
                            <label class="block font-medium">New Password: </label>
                            <input type="password" id="newpassword" name="newpassword"
                                class="form-control w-full box pr-10" th:name="newPassword" required disabled>
                        </div>

                        <div class="mb-4">
                            <label class="block font-medium">Confirm New Password: </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                class="form-control w-full box pr-10" required disabled>
                        </div>

                        <button class="btn btn-warning w-24 mr-1 mb-2" id="submitBtn" disabled>Change</button>
                    </form>
                </div>

                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <div class="mb-4">
                        <div id="success" th:if="${success}" style="color: green;" role="alert">
                            <p th:text="${success}"></p>
                        </div>
                        <div id="error" style="color: red;" role="alert"></div>
                        <div th:if="${error}" style="color: red;" role="alert">
                            <p th:text="${error}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <div class="mb-4">
                        <label class="block font-medium btn-warning">Password must be at least 8 characters long,
                            include uppercase,
                            lowercase, a number, and a special character. </label>
                    </div>
                </div>

            </div>


        </div>
        <!-- END: Content -->



        <!-- END: JS Assets-->
        <script src="../dist/js/app.js"></script>
        <script src="../dist/js/jquery-3.6.0.min.js"></script>
        <script src="../dist/js/jquery.dataTables.min.js"></script>
    </div>

    <div th:insert="~{/fragments/footer}"></div>

</body>
<script>

    function validatePasswordMatch() {
        var password = $('#newpassword').val().trim();
        var confirmPassword = $('#confirmPassword').val().trim();
        var errorMessage = $('#error');
        var submitButton = $('#submitBtn');

        // Password validation regex
        var passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%^&+=]).{8,}$/;

        // Clear previous errors
        errorMessage.text('');

        // Only validate if fields are enabled and have values
        if (!$('#newpassword').prop('disabled') && password.length > 0) {
            if (!passwordRegex.test(password)) {
                errorMessage.text("Password must be at least 8 characters long, include uppercase, lowercase, a number, and a special character.");
                submitButton.prop("disabled", true);
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.text("Passwords do not match.");
                submitButton.prop("disabled", true);
            } else {
                submitButton.prop("disabled", false);
            }
        }
    }

    // Update event listeners
    $('#newpassword, #confirmPassword').on('input', validatePasswordMatch);


    document.getElementById('newpassword').addEventListener('input', validatePasswordMatch);
    document.getElementById('confirmPassword').addEventListener('input', validatePasswordMatch);

    $(document).ready(function () {
        $('#oldpassword').on('input', function () {
            var oldpassword = $('#oldpassword').val();
            console.log("Sending password check for:", oldpassword); // Debug log

            if (oldpassword.length > 0) {
                $.ajax({
                    url: "/telco_co/user/passcheck",
                    type: 'GET',
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader(
                            $('meta[name="_csrf_header"]').attr('content'),
                            $('meta[name="_csrf"]').attr('content')
                        );
                    },
                    data: { password: oldpassword },
                    success: function (result, status, xhr) {
                        console.log("API Response:", result);
                        if (!result.samePass) {
                            $('#error').text('The old password does not match. Try again!');
                            $('#oldpassword').focus();
                            $('#submitBtn').prop("disabled", true);
                            $('#newpassword').prop("disabled", true);
                            $('#confirmPassword').prop("disabled", true);
                        } else {
                            $('#error').text('');
                            $('#oldpassword').prop("readonly", true);
                            $('#newpassword').prop("disabled", false);
                            $('#confirmPassword').prop("disabled", false);
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error("AJAX Error:", status, error);
                        $('#error').text('Error checking password. Please try again.');
                    }
                });

            }
        });
    });


</script>

</html>
