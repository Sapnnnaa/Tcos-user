<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Telco password reset">
    <meta name="author" content="Sigma eSolution">
    <title>TELCO - Password Reset</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="_csrf" content="dummy-csrf-token" />
    <meta name="_csrf_header" content="X-CSRF-TOKEN" />
</head>
<style>
    .dataTables_length select { width: 60px; }
    .badge { display: inline-block; padding: 5px 10px; font-size: 14px; font-weight: bold; border-radius: 5px; }
    .badge-other { color: white; background-color: red; }
    .badge-active { color: white; background-color: green; }
    @media (min-width: 768px) { .form-container { max-width: 500px; } }
    @media (min-width: 1024px) { .form-container { max-width: 600px; } }
</style>

<body class="bg-gray-50 min-h-screen flex items-center justify-center py-8 px-4">
    <div class="form-container w-full max-w-md lg:max-w-lg mx-auto bg-white rounded-xl shadow-lg p-6 lg:p-8 space-y-6">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl lg:text-3xl font-bold text-gray-900 mb-2">Password Reset</h1>
            <p class="text-gray-600 text-sm lg:text-base">Enter your ticket number to reset your password</p>
        </div>

        <div>
            <label for="ticketNumber" class="block text-sm lg:text-base font-medium text-gray-700 mb-2">Enter Ticket Number</label>
            <input type="text" id="ticketNumber"
                class="w-full px-4 py-3 lg:py-4 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm lg:text-base transition duration-200"
                placeholder="Enter your ticket number">
        </div>

        <button onclick="verifyTicket()"
            class="w-full bg-indigo-600 text-white py-3 lg:py-4 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 font-medium text-sm lg:text-base transform hover:scale-105 active:scale-95">
            Verify Ticket
        </button>

        <div id="ticketStatus" class="text-sm lg:text-base hidden rounded-lg p-3"></div>
        <div id="userDetails" class="text-sm lg:text-base hidden bg-gray-50 rounded-lg p-4"></div>

        <div id="sendOtpSection" class="hidden">
            <button onclick="sendOtp()" class="w-full bg-blue-600 text-white py-3 lg:py-4 px-4 rounded-lg hover:bg-blue-700 transition duration-200 font-medium text-sm lg:text-base transform hover:scale-105 active:scale-95">
                Send OTP
            </button>
        </div>

        <div id="otpSection" class="hidden space-y-4">
            <div>
                <label for="otpbox" class="block text-sm lg:text-base font-medium text-gray-700 mb-2">Enter OTP</label>
                <input type="text" id="otpbox" maxlength="6"
                    class="w-full px-4 py-3 lg:py-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm lg:text-base text-center tracking-widest transition duration-200"
                    placeholder="Enter 6-digit OTP">
            </div>
            <button onclick="verifyOtp()"
                class="w-full bg-blue-600 text-white py-3 lg:py-4 px-4 rounded-lg hover:bg-blue-700 transition duration-200 font-medium text-sm lg:text-base transform hover:scale-105 active:scale-95">
                Verify OTP
            </button>
            <div id="otpStatus" class="text-sm lg:text-base hidden rounded-lg p-3"></div>
        </div>

        <div id="passwordSection" class="hidden space-y-4">
            <div>
                <label for="newPassword" class="block text-sm lg:text-base font-medium text-gray-700 mb-2">New Password</label>
                <input type="password" id="newPassword"
                    class="w-full px-4 py-3 lg:py-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm lg:text-base transition duration-200"
                    placeholder="Enter new password">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm lg:text-base font-medium text-gray-700 mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword"
                    class="w-full px-4 py-3 lg:py-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm lg:text-base transition duration-200"
                    placeholder="Confirm new password">
            </div>

            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                <p class="text-blue-800 text-xs lg:text-sm font-medium mb-1">Password Requirements:</p>
                <ul class="text-blue-700 text-xs lg:text-sm space-y-1">
                    <li>• At least 8 characters long</li>
                    <li>• Include uppercase and lowercase letters</li>
                    <li>• Include at least one number</li>
                    <li>• Include at least one special character</li>
                </ul>
            </div>

            <button onclick="resetPassword()"
                class="w-full bg-green-600 text-white py-3 lg:py-4 px-4 rounded-lg hover:bg-green-700 transition duration-200 font-medium text-sm lg:text-base transform hover:scale-105 active:scale-95">
                Reset Password
            </button>
            <div id="passwordStatus" class="text-sm lg:text-base hidden rounded-lg p-3"></div>
        </div>
    </div>
</body>

<script>
    async function verifyTicket() {
        const ticket = document.getElementById('ticketNumber').value.trim();
        const ticketStatus = document.getElementById('ticketStatus');
        const sendOtpSection = document.getElementById('sendOtpSection');
        const userDetails = document.getElementById('userDetails');

        // Clear UI sections
        ticketStatus.classList.add("hidden");
        sendOtpSection.classList.add("hidden");
        userDetails.classList.add("hidden");
        userDetails.innerHTML = '';

        if (!ticket) {
            ticketStatus.className = "text-red-600 bg-red-50 border border-red-200";
            ticketStatus.textContent = "Please enter a ticket number.";
            ticketStatus.classList.remove("hidden");
            return;
        }

        try {
            const response = await fetch(`/telco_co/checkTicketNumber?userId=${ticket}`);
            const result = await response.json();

            if (result.msg === "1") {
                // Show user details
                userDetails.classList.remove("hidden");
                userDetails.innerHTML = `
                <div class="text-gray-700">
                    <h3 class="font-semibold mb-3 text-gray-900">User Details:</h3>
                    <div class="space-y-2">
                        <p><span class="font-medium">Name:</span> ${result.name}</p>
                        <p><span class="font-medium">Phone:</span> ${result.phonenum}</p>
                    </div>
                    <input type="hidden" id="phnum" value="${result.phonenum}" />
                </div>
            `;

                ticketStatus.className = "text-orange-700 bg-orange-50 border border-orange-200";
                ticketStatus.textContent = "Is this your name and phone number? If yes, then send the OTP.";
                ticketStatus.classList.remove("hidden");

                sendOtpSection.classList.remove("hidden");
            } else {
                ticketStatus.className = "text-red-600 bg-red-50 border border-red-200";
                ticketStatus.textContent = "Invalid ticket number. Please try again.";
                ticketStatus.classList.remove("hidden");
            }
        } catch (err) {
            console.error("Error:", err);
            ticketStatus.className = "text-red-600 bg-red-50 border border-red-200";
            ticketStatus.textContent = "Error checking ticket number.";
            ticketStatus.classList.remove("hidden");
        }
    }

    async function sendOtp() {
        const pno = document.getElementById('phnum').value.trim();
        const otpSection = document.getElementById('otpSection');
        const otpStatus = document.getElementById('otpStatus');

        if (!pno) {
            otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
            otpStatus.textContent = "Phone number not found.";
            otpStatus.classList.remove("hidden");
            return;
        }

        try {
            const response = await fetch(`/telco_co/resetpasswordotpsend?number=${pno}`);
            const result = await response.json();

            if (result.msg) {
                otpStatus.className = "text-green-600 bg-green-50 border border-green-200";
                otpStatus.textContent = "OTP sent to the registered number.";
                otpSection.classList.remove("hidden");
                otpStatus.classList.remove("hidden");
            } else {
                otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
                otpStatus.textContent = "Failed to send OTP.";
                otpStatus.classList.remove("hidden");
            }
        } catch (err) {
            console.error("Error:", err);
            otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
            otpStatus.textContent = "Error sending OTP.";
            otpStatus.classList.remove("hidden");
        }
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpbox').value.trim();
        const otpStatus = document.getElementById('otpStatus');
        const passwordSection = document.getElementById('passwordSection');

        if (!otp) {
            otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
            otpStatus.textContent = "Please enter the OTP.";
            otpStatus.classList.remove("hidden");
            return;
        }

        try {
            const response = await fetch(`/telco_co/checkresetpasswordotp?otp=${otp}`);
            const result = await response.json();

            if (result.msg) {
                otpStatus.className = "text-green-600 bg-green-50 border border-green-200";
                otpStatus.textContent = "OTP verified successfully!";
                passwordSection.classList.remove("hidden");
                otpStatus.classList.remove("hidden");
            } else {
                otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
                otpStatus.textContent = "Incorrect OTP. Please try again.";
                otpStatus.classList.remove("hidden");
            }
        } catch (err) {
            console.error("Error:", err);
            otpStatus.className = "text-red-600 bg-red-50 border border-red-200";
            otpStatus.textContent = "Error verifying OTP.";
            otpStatus.classList.remove("hidden");
        }
    }

    function validatePassword(password) {
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
        return regex.test(password);
    }

    async function resetPassword() {
    const newPassword = document.getElementById('newPassword').value.trim();
    const confirmPassword = document.getElementById('confirmPassword').value.trim();
    const ticketNumber = document.getElementById('ticketNumber').value.trim();
    const statusDiv = document.getElementById('passwordStatus');

    // Clear previous messages
    statusDiv.classList.add("hidden");

    // Validation
    if (!newPassword || !confirmPassword) {
        showError("Both password fields are required.");
        return;
    }

    if (newPassword !== confirmPassword) {
        showError("Passwords do not match.");
        return;
    }

    if (!validatePassword(newPassword)) {
        showError("Password must meet all requirements.");
        return;
    }

    try {
        // Encode parameters for URL
        const encodedTicket = encodeURIComponent(ticketNumber);
        const encodedPassword = encodeURIComponent(newPassword);
        
        const url = `/telco_co/resetpasswordotp?ticketNumber=${encodedTicket}&newPassword=${encodedPassword}`;
        
        console.log("Making GET request to:", url);
        
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            }
        });

        // First check if we got any response
        if (!response) {
            throw new Error('No response from server');
        }

        // Get the response text first for debugging
        const responseText = await response.text();
        console.log('Raw server response:', responseText);

        let result;
        try {
            result = JSON.parse(responseText);
        } catch (parseError) {
            console.error('Failed to parse JSON:', parseError);
            throw new Error(`Server returned invalid response: ${responseText.substring(0, 100)}`);
        }

        console.log('Parsed response:', result);

        if (result.success) {
            Swal.fire({
                title: 'Success!',
                text: result.message || 'Password reset successful!',
                icon: 'success',
                confirmButtonText: 'OK'
            }).then(() => {
                window.location.href = "/telco_co/userlogin";
            });
        } else {
            throw new Error(result.message || 'Password reset failed');
        }
    } catch (error) {
        console.error("Password reset error:", error);
        showError(error.message || 'Failed to reset password');
    }
}

function showError(message) {
    const statusDiv = document.getElementById('passwordStatus');
    statusDiv.className = "text-red-600 bg-red-50 border border-red-200";
    statusDiv.textContent = message;
    statusDiv.classList.remove("hidden");
}

    // Event listeners for better UX
    document.addEventListener('DOMContentLoaded', function() {
        // Enter key support
        const ticketInput = document.getElementById('ticketNumber');
        if (ticketInput) {
            ticketInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifyTicket();
            });
        }

        // Auto-focus OTP input
        const otpSection = document.getElementById('otpSection');
        if (otpSection) {
            const observer = new MutationObserver(function() {
                if (!otpSection.classList.contains('hidden')) {
                    setTimeout(() => {
                        const otpInput = document.getElementById('otpbox');
                        if (otpInput) {
                            otpInput.focus();
                            otpInput.addEventListener('keypress', function(e) {
                                if (e.key === 'Enter') verifyOtp();
                            });
                        }
                    }, 100);
                }
            });
            observer.observe(otpSection, { attributes: true });
        }

        // Enter key for password confirmation
        const passwordSection = document.getElementById('passwordSection');
        if (passwordSection) {
            const observer = new MutationObserver(function() {
                if (!passwordSection.classList.contains('hidden')) {
                    setTimeout(() => {
                        const confirmPass = document.getElementById('confirmPassword');
                        if (confirmPass) {
                            confirmPass.addEventListener('keypress', function(e) {
                                if (e.key === 'Enter') resetPassword();
                            });
                        }
                    }, 100);
                }
            });
            observer.observe(passwordSection, { attributes: true });
        }
    });
</script>
</html>
